name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  HAXE_VERSION: 4.3.7

jobs:
  commit-kinds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test of the check
        run: bash .github/scripts/check-commit-kinds-test.sh
      - name: Commits do not mix code and infrastructure
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != 0000000000000000000000000000000000000000 ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}^..${{ github.sha }}"
          fi
          bash .github/scripts/check-commit-kinds.sh "$range"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
      - name: Install libraries
        run: |
          git clone --depth=1 https://github.com/GeTechG/haxeui-core.git ../haxeui-core
          haxelib dev haxeui-core ../haxeui-core
          git clone --depth=1 https://github.com/GeTechG/heaps.git ../heaps
          haxelib dev heaps ../heaps
          haxelib dev haxeui-heaps .
          haxelib install hlsdl --quiet
          haxelib install format --quiet
      - name: Compile the backend
        run: haxe -lib haxeui-core -lib heaps -lib haxeui-heaps -lib hlsdl -hl main.hl --no-output --macro 'haxe.macro.Compiler.include("haxe.ui", ["haxe.ui.macros"])'
